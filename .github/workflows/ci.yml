name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      # Placeholder values only. No real secrets or database are used or needed:
      # the unit tests mock the database and the build does not connect to it.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production-0000
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      RATE_LIMIT_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Coverage thresholds
        run: npm run test:coverage

      - name: Build
        run: npm run build
  migrations:
    name: Migrations replay on an empty database
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: ci
      PGPASSWORD: ci
      PGDATABASE: ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Replay all journaled migrations (strict)
        run: node scripts/replay-migrations.mjs

      - name: Re-applying the latest migration on the aligned schema is a no-op
        run: |
          psql -t -A -q -f scripts/schema-snapshot.sql -o before.json
          psql -v ON_ERROR_STOP=1 -q -f drizzle/0054_align_legacy_tables.sql
          psql -t -A -q -f scripts/schema-snapshot.sql -o after.json
          diff before.json after.json && echo 'No schema change on re-apply'

      - name: Snapshot the replayed schema
        run: psql -t -A -q -f scripts/schema-snapshot.sql -o replayed-schema.json

      - uses: actions/upload-artifact@v4
        with:
          name: replayed-schema
          path: replayed-schema.json
          retention-days: 14
