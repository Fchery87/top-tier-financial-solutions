name: E2E

# Playwright specs run against a THROWAWAY Postgres created for this job.
# They sign up users and grant roles, so they must never see a real database:
# nothing here reads repository secrets, and DATABASE_URL points at the service
# container below. Run manually or weekly rather than on every PR.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (chromium)
    # Pinned: Playwright 1.58 does not support the Ubuntu 26.04 that ubuntu-latest now maps to.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The app uses Neon's WebSocket driver; wsproxy lets it speak to plain Postgres.
      wsproxy:
        image: ghcr.io/neondatabase/wsproxy:latest
        env:
          ALLOW_ADDR_REGEX: '.*'
        ports:
          - 5433:80
    env:
      CI: 'true'
      NODE_ENV: development
      # The app reaches Postgres through the proxy using the service hostname.
      DATABASE_URL: postgresql://e2e:e2e@postgres:5432/e2e?sslmode=disable
      NEON_WS_PROXY: localhost:5433/v1
      BETTER_AUTH_SECRET: ci-only-e2e-secret-not-used-anywhere-else-0000
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      RATE_LIMIT_DISABLED: 'true'
      E2E_PASSWORD: E2e-ci-Passw0rd-Not-Real!
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to the throwaway database
        env:
          PGPASSWORD: e2e
        run: |
          # The journaled history cannot be replayed strictly on an empty database
          # (0013 and 0014 both create inquiry_disputes), so tolerate "already exists"
          # but fail on any other error.
          node -e "const j=require('./drizzle/meta/_journal.json');console.log(j.entries.map(e=>e.tag).join('\n'))" > /tmp/migrations.txt
          : > /tmp/migration-errors.txt
          while read -r tag; do
            psql -h localhost -U e2e -d e2e -q -f "drizzle/$tag.sql" 2>> /tmp/migration-errors.txt || true
          done < /tmp/migrations.txt
          grep 'ERROR' /tmp/migration-errors.txt | grep -v 'already exists' && { echo 'Unexpected migration errors above'; exit 1; } || echo 'Migrations applied (ignoring already-exists)'
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npx playwright test --project=chromium --reporter=list,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
